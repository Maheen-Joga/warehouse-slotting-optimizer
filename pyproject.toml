[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-slotting-optimizer"
version = "0.1.0"
description = "Compare SKU slotting and pick-routing policies on a warehouse layout, with a demand-forecast backtest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maheen Joga" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["slotting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
